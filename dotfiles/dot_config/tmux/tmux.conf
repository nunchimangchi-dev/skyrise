# Deliberately close to tmux's defaults — prefix stays C-b so this behaves
# the same on any machine, including ones I don't own.

set -g mouse on
set -g base-index 1
setw -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-position bottom
set -g status-style bg=default
set -g status-left "#[bold]#S "
set -g status-left-length 20
set -g status-right "%Y-%m-%d %H:%M"

# Plugins, managed by TPM (prefix + I to install, prefix + U to update).
# scripts/install/20-tmux.sh installs these headlessly on first bootstrap.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

run '~/.config/tmux/plugins/tpm/tpm'
